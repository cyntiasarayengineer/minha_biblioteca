name: minha_biblioteca
description: "Um aplicativo simples para salvar e organizar suas citações de livros."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  widgets_to_image: ^0.0.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#4A148C"
  image: assets/app_icon.png
  android_12:
    image: assets/app_icon.png
    color: "#4A148C"